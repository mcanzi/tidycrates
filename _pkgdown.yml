url: https://mcanzi.de/tidycrates/

template:
  bootstrap: 5
  theme: a11y-dark
  bslib:
    bg: "#1e2830"
    fg: "#dfe6ea"
    primary: "#a9cbe0"
    secondary: "#98a8b3"
    link-color: "#f6b8a4"
    link-hover-color: "#a9cbe0"
    code-color: "#f2917a"
    border-color: "#34444f"
    navbar-bg: "#1e2830"
    base_font: "Atkinson Hyperlegible"
    heading_font: "Bricolage Grotesque"
    code_font: "JetBrains Mono"
  includes:
    in_header: <link rel="stylesheet" href="https://mcanzi.de/fonts/fonts.css">

navbar:
  structure:
    left: [intro, reference, news]
    right: [search, website, github]
  components:
    website:
      text: mcanzi.de
      href: https://mcanzi.de/
      aria-label: Massimiliano Canzi's website

reference:
- title: Setup
  contents:
  - dig_auth
  - dig_user_agent
  - dig_rate_limit
- title: Database
  contents:
  - dig_release
  - dig_master
  - dig_artist
  - dig_label
- title: Lists
  contents:
  - dig_artist_releases
  - dig_label_releases
  - dig_master_versions
- title: Users
  contents:
  - dig_collection
  - dig_wantlist
  - dig_tally
  - dig_plot
- title: Unnesting release data
  contents:
  - unnest_release
- title: Package
  contents:
  - tidycrates-package
